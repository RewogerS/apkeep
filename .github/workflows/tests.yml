name: Tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust and clippy
        run: rustup update stable --profile minimal --component clippy
      - name: Test every target
        run: cargo +stable test --locked --all-targets
      - name: Lint every target
        run: cargo +stable clippy --locked --all-targets
      - name: Build documentation
        run: cargo +stable doc --locked --no-deps
      - name: Test release script without contacting remote hosts
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate release script syntax
        run: bash -n build-remote.sh
      - name: Check generated help is committed
        run: git diff --exit-code -- USAGE
